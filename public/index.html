<!DOCTYPE html>
<html>
<head>
  <title>JotPsych Feature Video Generator</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 0 20px;
      background: #FFF2F5;
      color: #1C1E85;
    }
    h1 { color: #1E125E; }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    input {
      width: 65%;
      border: 2px solid #813FE8;
      border-radius: 6px;
    }
    button {
      background: #813FE8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1E125E; }
    #status { margin-top: 10px; color: #1E125E; }
    #videoWrap {
      display: none;
      margin: 20px auto 0 auto;
      border: 6px solid #813FE8;
      background: #FD96C9;
      border-radius: 16px;
      padding: 6px;
      width: 280px;
      height: 500px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(29, 30, 133, 0.15);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>JotPsych Feature Video Generator</h1>
  <input id="feature" placeholder="Describe a JotPsych feature..." />
  <button onclick="generate()">Go</button>
  <p id="status"></p>

  <div id="videoWrap">
    <video id="result" controls>
      <track id="subs" kind="subtitles" srclang="en" default>
    </video>
  </div>

  <script>
    async function generate() {
      const feature = document.getElementById("feature").value;
      const statusEl = document.getElementById("status");
      const videoWrap = document.getElementById("videoWrap");
      videoWrap.style.display = "none";
      statusEl.textContent = "Writing the script...";

      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ feature }),
      });

      if (!res.ok) {
        statusEl.textContent = "Something went wrong. Try again.";
        return;
      }

      const { videoRequestId, audioUrl, script } = await res.json();
      statusEl.textContent = "Generating video...";
      pollVideo(videoRequestId, audioUrl, script);
    }

    async function pollVideo(requestId, audioUrl, script) {
      const res = await fetch(`/api/status/video/${requestId}?audioUrl=${encodeURIComponent(audioUrl)}`);
      const data = await res.json();

      if (data.status === "lipsync_started") {
        document.getElementById("status").textContent = "Syncing lips to audio...";
        pollLipsync(data.lipsyncRequestId, script);
        return;
      }

      if (data.error) {
        document.getElementById("status").textContent = "Generation failed. Try again.";
        return;
      }

      setTimeout(() => pollVideo(requestId, audioUrl, script), 3000);
    }

    async function pollLipsync(requestId, script) {
      const res = await fetch(`/api/status/lipsync/${requestId}`);
      const data = await res.json();

      if (data.status === "done") {
        document.getElementById("status").textContent = "Done!";
        const videoEl = document.getElementById("result");
        videoEl.src = data.videoUrl;

        // --- DYNAMIC WORD-PROPORTIONAL SUBTITLES ---
        const words = script.trim().split(/\s+/);
        const chunkSize = 4; // Words per subtitle card
        
        // Estimate total audio duration based on average speaking rate (~2.5 words per second)
        const estimatedDuration = Math.max(8, words.length / 2.5); 
        const secondsPerWord = estimatedDuration / words.length;

        let vtt = "WEBVTT\n\n";
        let currentTime = 0;

        for (let i = 0; i < words.length; i += chunkSize) {
          const chunkWords = words.slice(i, i + chunkSize);
          const chunkText = chunkWords.join(" ");
          
          const startTime = currentTime;
          const duration = chunkWords.length * secondsPerWord;
          currentTime += duration;
          const endTime = currentTime;

          vtt += `${formatTime(startTime)} --> ${formatTime(endTime)}\n${chunkText}\n\n`;
        }

        const blob = new Blob([vtt], { type: "text/vtt" });
        document.getElementById("subs").src = URL.createObjectURL(blob);
        // ------------------------------------------

        document.getElementById("videoWrap").style.display = "inline-block";
        return;
      }

      if (data.error) {
        document.getElementById("status").textContent = "Lipsync failed. Try again.";
        return;
      }

      setTimeout(() => pollLipsync(requestId, script), 3000);
    }

    // Helper to format seconds into WebVTT timestamp format (HH:MM:SS.mmm)
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.floor(totalSeconds % 60);
      const milliseconds = Math.floor((totalSeconds % 1) * 1000);
      return `00:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
    }
  </script>
</body>
</html>
